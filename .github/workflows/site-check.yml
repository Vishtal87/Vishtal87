# Checks a deployed site from outside (GitHub's network): health, map data, news counts.
# Run it from the Actions tab or the API with the site's base URL; the URL is masked in the log.
name: site-check
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL, e.g. http://203.0.113.10:8080 or https://news.example.ru"
        required: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        env:
          BASE: ${{ inputs.url }}
        run: |
          echo "::add-mask::$BASE"
          host=$(echo "$BASE" | sed -E 's#^[a-z]+://##; s#[:/].*$##'); echo "::add-mask::$host"
          code() { curl -s -o /dev/null -m 20 -w "%{http_code}" "$1"; }
          for p in 80 443 8080 8081 8443; do
            timeout 5 bash -c "exec 3<>/dev/tcp/$host/$p" 2>/dev/null && echo "port $p     open" || echo "port $p     closed"
          done
          echo "page       $(code "$BASE/")"
          echo "--- response headers of / (who answers there):"
          curl -sI -m 15 "$BASE/" | grep -iE "^(HTTP|server|x-powered-by|location|content-type)" || true
          echo "--- page title:"
          curl -s -m 15 "$BASE/" | grep -io "<title>[^<]*" | head -1 || true
          echo "health     $(code "$BASE/api/health")"
          curl -fsS -m 20 "$BASE/api/health" | python3 -c "import sys,json; d=json.load(sys.stdin); print('status', d.get('status'), 'sources', d.get('sources'), 'events', d.get('events'), 'queue', d.get('queue'))" 2>/dev/null || echo "health body unavailable"
          curl -fsS -m 30 "$BASE/api/map/aggregate?level=country&lang=ru&window=24h" | python3 -c "import sys,json; d=json.load(sys.stdin); print('countries', [(f['properties']['name'], f['properties']['count']) for f in d['features']][:10], 'total', (d.get('meta') or {}).get('total_events'))" 2>/dev/null || echo "aggregate unavailable"
          curl -fsS -m 30 "$BASE/api/map/aggregate?level=locality&lang=ru&window=24h&bbox=36,43,42,47" | python3 -c "import sys,json; d=json.load(sys.stdin); print('kuban places', sorted([(f['properties'].get('name'), f['properties'].get('count')) for f in d['features'] if f['properties'].get('kind')=='locality'], key=lambda x: -(x[1] or 0))[:15])" 2>/dev/null || echo "kuban aggregate unavailable"
          echo "tile       $(code "$BASE/tiles/base/2/2/1.pbf?lang=ru")"
