server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/json application/x-protobuf text/css application/javascript;

  location /api/stream {                      # Server-Sent Events: no buffering, long-lived
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location /tiles/ { proxy_pass http://api:8000; expires 1d; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }   # content-hashed file names
  location /glyphs/ { expires 30d; }
  location / { try_files $uri /index.html; }
}
