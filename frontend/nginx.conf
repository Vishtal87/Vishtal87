server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve the api service per request via Docker's DNS: a recreated api container gets a new IP,
  # and a name resolved once at nginx start would keep answering 502 until web is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  gzip on;
  gzip_types application/json application/x-protobuf text/css application/javascript;

  location /api/stream {                      # Server-Sent Events: no buffering, long-lived
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/ { proxy_pass $api; proxy_set_header Host $host; }
  location /tiles/ { proxy_pass $api; expires 1d; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }   # content-hashed file names
  location /glyphs/ { expires 30d; }
  location / { try_files $uri /index.html; }
}
