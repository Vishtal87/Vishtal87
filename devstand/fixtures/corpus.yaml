# SYNTHETIC TEST CORPUS — NOT REAL NEWS.
# Real place names (GeoNames) + illustrative, invented events. Every source is named "Демо"/"Demo" and is
# flagged synthetic in the product UI. Purpose: end-to-end verification of ingestion, geolocation,
# deduplication, clustering, trust labels and realtime delivery where the real web is unreachable.
#
# at: minutes relative to devstand start (negative = in the past). release: live -> held until /control/release.
# update_of: later version of an earlier report (same guid/url). forward: telegram forward of an earlier report.
# gold: expected place (GeoNames English name + country) and a cluster key for B-cubed evaluation.

sources:
  demo-kuban-news:      {format: rss, date_style: rfc822_offset, tz: "+03:00"}
  demo-krasnodar-24:    {format: rss, date_style: naive_local}          # no timezone in feed (source tz = Moscow)
  demo-tg-dinskaya:     {format: telegram}
  demo-tg-kuban-live:   {format: telegram}
  demo-tg-primorye:     {format: telegram}
  demo-kyiv-live:       {format: telegram}
  demo-mchs-kuban:      {format: html_list}
  demo-adm-gk:          {format: rss, date_style: rfc822_offset, tz: "+03:00"}
  demo-yt-kuban-tv:     {format: youtube}
  demo-sochi-blog:      {format: rss, date_style: iso_z}
  demo-ria-federal:     {format: rss, date_style: rfc822_offset, tz: "+03:00"}
  demo-rlp-lokal:       {format: atom, tz: "+02:00"}
  demo-dw-de:           {format: atom, tz: "+02:00"}
  demo-world-en:        {format: rss, date_style: rfc822_gmt}
  demo-idaho-local:     {format: rss, date_style: rfc822_offset, tz: "-06:00"}
  demo-lyon-info:       {format: rss, date_style: rfc822_offset, tz: "+02:00"}
  demo-toledo-hoy:      {format: rss, date_style: rfc822_offset, tz: "+02:00"}
  demo-lecco-notizie:   {format: rss, date_style: rfc822_offset, tz: "+02:00"}
  demo-gdelt:           {format: gdelt}
  demo-flaky:           {format: rss, date_style: rfc822_offset, tz: "+03:00", fail: {mode: "503", first_requests: 2}}
  demo-broken-xml:      {format: broken}

stories:
  # ---------------------------------------------------------------- village-level event, 7 sources, official + video
  - key: dinskaya-fire
    gold: {place: Dinskaya, cc: RU, category: incidents}
    reports:
      - {id: dinf-1, source: demo-tg-dinskaya, at: -95, title: "🔥 Горит дом на улице Красной", body: "Жители станицы Динской сообщают о пожаре в частном доме на улице Красной. Пожарные уже выехали."}
      - {id: dinf-2, source: demo-tg-kuban-live, at: -90, forward: dinf-1, title: "🔥 Горит дом на улице Красной", body: "Жители станицы Динской сообщают о пожаре в частном доме на улице Красной. Пожарные уже выехали. Подписывайтесь на наш канал!"}
      - {id: dinf-3, source: demo-kuban-news, at: -80, title: "В станице Динской загорелся частный дом", body: "Пожар в жилом доме на улице Красной в станице Динской Краснодарского края начался около 13:40. На месте работают три пожарных расчёта."}
      - {id: dinf-4, source: demo-mchs-kuban, at: -70, title: "Ликвидация возгорания в Динском районе", body: "В 13:41 поступило сообщение о возгорании жилого дома в ст. Динской. К тушению привлечены 12 человек и 3 единицы техники. Пострадавших нет."}
      - {id: dinf-5, source: demo-krasnodar-24, at: -60, title: "Пожар в Динской: огонь охватил 120 квадратных метров", body: "В станице Динской горит частный дом, площадь пожара составляет 120 квадратных метров, сообщают спасатели."}
      - {id: dinf-6, source: demo-yt-kuban-tv, at: -45, media: video, title: "Видео: пожар в станице Динской", body: "Кадры с места пожара в станице Динской: огонь охватил крышу частного дома на улице Красной."}
      - {id: dinf-7, source: demo-ria-federal, at: -40, title: "На Кубани загорелся жилой дом", body: "В станице Динской Краснодарского края произошёл пожар в частном доме, сообщили спасатели."}
      - {id: dinf-8, source: demo-kuban-news, at: 2, release: live, update_of: dinf-3, title: "Пожар в станице Динской потушен", body: "Пожар в жилом доме на улице Красной в станице Динской Краснодарского края потушен. Площадь возгорания составила 120 квадратных метров, пострадавших нет."}
      - {id: dinf-9, source: demo-mchs-kuban, at: 5, release: live, title: "Пожар в ст. Динской ликвидирован", body: "Пожар в жилом доме в станице Динской ликвидирован в 15:05. Пострадавших нет, причины возгорания устанавливаются."}

