  - {<<: *demo, slug: demo-lecco-notizie, name: "Demo: Notizie di Lecco", type: local_media, connector: rss, access_model: public_feed,
     url: "${DEVSTAND_URL:-http://127.0.0.1:8090}/rss/demo-lecco-notizie.xml", languages: [it], country: IT,
