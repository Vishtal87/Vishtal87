# DEMO source registry — points at devstand (synthetic data, clearly labeled in the UI).
# Names are fictional on purpose: synthetic reports must never be attributed to a real outlet or authority.
# Real sources live in sources.example.yaml and are enabled once the environment has network access.
x-demo: &demo {synthetic: true, poll_interval: 20, legal_note: "Synthetic test data served by devstand"}

sources:
  - {<<: *demo, slug: demo-kuban-news, name: "Демо: Краевой вестник", type: regional_media, connector: rss, access_model: public_feed,
     url: "${DEVSTAND_URL:-http://127.0.0.1:8090}/rss/demo-kuban-news.xml", languages: [ru], country: RU, home: {q: "Краснодарский край", cc: RU, kind: admin1}}
  - {<<: *demo, slug: demo-krasnodar-24, name: "Демо: Городской портал Краснодара", type: local_media, connector: rss, access_model: public_feed,
     url: "${DEVSTAND_URL:-http://127.0.0.1:8090}/rss/demo-krasnodar-24.xml", languages: [ru], country: RU, timezone: Europe/Moscow,
     home: {q: "Краснодар", cc: RU, kind: locality}}
  - {<<: *demo, slug: demo-tg-dinskaya, name: "Демо: Динская — соседи (Telegram)", type: telegram, connector: telegram_public,
     access_model: public_web, url: "${DEVSTAND_URL:-http://127.0.0.1:8090}/tg/s/demo-tg-dinskaya", languages: [ru], country: RU,
     home: {q: "Динская", cc: RU, kind: locality}}
  - {<<: *demo, slug: demo-tg-kuban-live, name: "Демо: Новости края (Telegram)", type: telegram, connector: telegram_public,
     access_model: public_web, url: "${DEVSTAND_URL:-http://127.0.0.1:8090}/tg/s/demo-tg-kuban-live", languages: [ru], country: RU,
     home: {q: "Краснодарский край", cc: RU, kind: admin1}}
  - {<<: *demo, slug: demo-tg-primorye, name: "Демо: Приморский канал (Telegram)", type: telegram, connector: telegram_public,
     access_model: public_web, url: "${DEVSTAND_URL:-http://127.0.0.1:8090}/tg/s/demo-tg-primorye", languages: [ru], country: RU,
     home: {q: "Primorye", cc: RU, kind: admin1}}
  - {<<: *demo, slug: demo-kyiv-live, name: "Демо: Київський канал (Telegram)", type: telegram, connector: telegram_public,
     access_model: public_web, url: "${DEVSTAND_URL:-http://127.0.0.1:8090}/tg/s/demo-kyiv-live", languages: [uk], country: UA,
     home: {q: "Kyiv", cc: UA, kind: locality}}
  - {<<: *demo, slug: demo-mchs-kuban, name: "Демо: Краевая служба спасения (офиц.)", type: official, connector: html_list,
     access_model: public_web, url: "${DEVSTAND_URL:-http://127.0.0.1:8090}/site/demo-mchs-kuban/", languages: [ru], country: RU,
     timezone: Europe/Moscow, home: {q: "Краснодарский край", cc: RU, kind: admin1},
     config: {item_xpath: "//a[@class='news-link']/@href", max_new: 20}}
  - {<<: *demo, slug: demo-adm-gk, name: "Демо: Муниципальный сайт (офиц.)", type: official, connector: rss,
     access_model: public_feed, url: "${DEVSTAND_URL:-http://127.0.0.1:8090}/rss/demo-adm-gk.xml", languages: [ru], country: RU,
     home: {q: "Горячий Ключ", cc: RU, kind: locality}}
  - {<<: *demo, slug: demo-yt-kuban-tv, name: "Демо: Региональное ТВ (YouTube)", type: youtube, connector: youtube_rss,
     access_model: public_feed, url: "${DEVSTAND_URL:-http://127.0.0.1:8090}/yt/feeds/videos.xml?channel_id=demo-yt-kuban-tv",
     languages: [ru], country: RU, home: {q: "Краснодарский край", cc: RU, kind: admin1}}
  - {<<: *demo, slug: demo-sochi-blog, name: "Демо: Блог «Сочи изнутри»", type: blog, connector: rss, access_model: public_feed,
