[project]
name = "geonews"
version = "0.1.0"
description = "LIVE GEO NEWS: geographic news exploration backend (ingestion, geoparsing, event clustering, map API)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=2.0",
  "pymorphy3>=2.0",
  "pymorphy3-dicts-ru",
  "pymorphy3-dicts-uk",
  "lingua-language-detector>=2.0",
  "dateparser>=1.2",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "geonamescache>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geonews = "geonews.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geonews*"]

[tool.setuptools.package-data]
"geonews.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests that need a PostgreSQL/PostGIS database (GEONEWS_TEST_DSN)"]
